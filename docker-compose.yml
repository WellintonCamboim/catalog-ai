services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment: &api-env
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/catalog_ai
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # One-off job: docker compose run --rm seed
  seed:
    build: ./api
    profiles: ["seed"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      <<: *api-env
      # The seed refuses to run with NODE_ENV=production.
      NODE_ENV: development
    command: ["node", "dist/seed/index.js"]

volumes:
  mongo-data:
  uploads-data:
